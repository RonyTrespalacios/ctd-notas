<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas del corte 2 · CTD</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #b3121f; --ink: #1f1f1f; --soft: #5b5b5b; --faint: #8a8a8a; --line: #e6e1dc; --bg: #fbfaf8;
    --bien: #1f7a4a; --acept: #a96800; --bajo: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.55 "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    border-top: 6px solid var(--rojo);
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 40px; }
  h1 { font: 600 26px/1.2 "Source Serif 4", Georgia, serif; color: var(--rojo); margin: 0; }
  .sub { color: var(--soft); font-size: 15px; margin: 4px 0 20px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  label { color: var(--soft); font-size: 15px; width: 100%; }
  input {
    flex: 1 1 180px; max-width: 260px; padding: 10px 12px; font: 17px "Source Sans 3", sans-serif;
    border: 1px solid #c9c2bb; border-radius: 4px; background: #fff; color: var(--ink);
  }
  button {
    padding: 10px 18px; font: 600 16px "Source Sans 3", sans-serif; border: 0; border-radius: 4px;
    background: var(--rojo); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  input:focus, button:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
  .aviso { color: var(--soft); }

  .resultado { display: grid; grid-template-columns: 340px 1fr; gap: 40px; }
  .nombre { color: var(--soft); font-size: 15px; margin: 0; }
  .final { font: 600 72px/1 "Source Serif 4", Georgia, serif; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .final small { font: 18px "Source Sans 3", sans-serif; color: var(--soft); }
  .estado { display: inline-block; margin: 4px 0 10px; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 99px; color: #fff; }
  .estado.bien { background: var(--bien); } .estado.acept { background: var(--acept); } .estado.bajo { background: var(--bajo); }
  .explica { color: var(--soft); font-size: 15px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
  td.n { text-align: right; width: 4.5em; font-variant-numeric: tabular-nums; }
  td .d { display: block; font-size: 14px; color: var(--faint); }
  .v { font-weight: 700; }
  .v.bajo { color: var(--bajo); }
  .barra { display: block; height: 4px; margin-top: 6px; border-radius: 2px; overflow: hidden; background: #eee9e4; }
  .barra i { display: block; height: 100%; }
  .barra i.bien { background: var(--bien); } .barra i.acept { background: var(--acept); } .barra i.bajo { background: var(--bajo); }
  h2 {
    font: 600 20px "Source Serif 4", Georgia, serif; color: var(--rojo); margin: 0 0 8px;
    padding-bottom: 4px; border-bottom: 2px solid var(--rojo); display: inline-block;
  }
  section + section { margin-top: 22px; }
  p { margin: 0 0 8px; }
  .preg { display: flex; gap: 3px; margin: 8px 0 6px; flex-wrap: wrap; }
  .preg i { width: 16px; height: 16px; border-radius: 2px; }
  .preg i.b { background: var(--bien); } .preg i.m { border: 1.5px solid var(--bajo); }
  .cuadro { padding: 10px 14px; margin: 8px 0; background: #f3eee9; border-left: 4px solid var(--rojo); border-radius: 0 4px 4px 0; font-size: 18px; }
  .chico { font-size: 14px; color: var(--faint); }
  .chip { display: inline-block; font-size: 14px; font-weight: 600; padding: 1px 10px; border-radius: 99px; background: #ece7e2; }
  .chip.alerta { background: var(--bajo); color: #fff; }
  .contacto { margin-top: 32px; font-size: 15px; color: var(--soft); }

  @media (max-width: 760px) {
    body { font-size: 16px; }
    .wrap { padding: 20px 16px 32px; }
    .resultado { grid-template-columns: 1fr; gap: 26px; }
    .final { font-size: 60px; }
    .preg i { width: 13px; height: 13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ciencia, Tecnología y Desarrollo</h1>
  <p class="sub">Notas del corte 2 · Periodo 2026-2 · Ing. Rony Trespalacios</p>

  <form id="f" autocomplete="off">
    <label for="cod">Escribe tu código estudiantil</label>
    <input id="cod" inputmode="numeric" maxlength="12" placeholder="Por ejemplo, 160005123" required>
    <button id="b" type="submit">Ver mis notas</button>
  </form>
  <hr>
  <div id="m"><p class="aviso">Tus notas aparecerán aquí.</p></div>
  <p class="contacto">¿Dudas o un error en tus notas? Escríbeme por Google Chat a <b>rony.trespalacios@unillanos.edu.co</b>.</p>
</div>

<script>
const PREFIJO = 'ctd-2026-2-c2|';
let DATA = null;
const $ = s => document.querySelector(s);
const enc = new TextEncoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const fmt = (n, d = 1) => (n === null || n === undefined) ? '—'
  : Number(n).toLocaleString('es-CO', { minimumFractionDigits: d, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const est = n => n >= 4 ? ['bien', 'Bien'] : n >= 3 ? ['acept', 'Aceptable'] : ['bajo', 'Por debajo de 3,0'];
const val = (n, d = 1) => {
  if (n === null || n === undefined) return '<span class="v">—</span>';
  const [c, t] = est(n); return `<span class="v ${c}" title="${t}">${fmt(n, d)}</span>`;
};
const barra = n => {
  if (n === null || n === undefined) return '';
  const [c] = est(n); return `<span class="barra"><i class="${c}" style="width:${Math.max(0, Math.min(100, n / 5 * 100))}%"></i></span>`;
};

async function sha(s) {
  const h = await crypto.subtle.digest('SHA-256', enc.encode(s));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function abrir(cod) {
  if (!DATA) DATA = await (await fetch('data.json', { cache: 'no-store' })).json();
  const reg = DATA.r[(await sha(PREFIJO + cod)).slice(0, 24)];
  if (!reg) return null;
  const base = await crypto.subtle.importKey('raw', enc.encode(PREFIJO + cod), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(reg.s), iterations: DATA.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(reg.i) }, key, b64(reg.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

function render(d, cod) {
  const sis = d.prog === 'sis';
  const e = d.ensayo;
  const tres = [d.previas, e.nota, d.taller].filter(v => v !== null && v !== undefined);
  const otras = tres.reduce((a, b) => a + b, 0) / tres.length;
  const dp = sis ? 1 : 2;
  const [ec, et] = est(d.corte);

  let parcial;
  if (sis && d.parcial_det) {
    const p = d.parcial_det;
    const cajas = Array.from({ length: 20 }, (_, i) => `<i class="${i < p.buenas ? 'b' : 'm'}"></i>`).join('');
    parcial = `<p>De 20 preguntas respondiste bien <b>${p.buenas}</b> y mal <b>${p.malas}</b>.</p>
      <div class="preg" aria-hidden="true">${cajas}</div>
      <div class="cuadro">${p.buenas} × 0,25 + 0,5 = <b>${fmt(d.parcial)}</b></div>
      <p class="chico">Cada respuesta buena vale 0,25. A todos se les sumó 0,5 a la nota final.</p>`;
  } else if (!sis && d.parcial_estado === 'Finalizado') {
    parcial = `<p>Nota del cuestionario en Moodle: <b>${fmt(d.parcial, 2)}</b> de 5,00.</p>`;
  } else {
    parcial = '<p>No hay registro de que hayas presentado el parcial.</p>';
  }

  let ensayo;
  if (e.c === undefined) {
    ensayo = `<p>${esc(e.obs)}</p>`;
  } else {
    const fila = (k, v) => `<tr><td>${k}${barra(v)}</td><td class="n">${val(v)}</td></tr>`;
    ensayo = `<table>${fila('Comprensión de la lectura', e.c)}${fila('Aplicación y posición', e.ap)}${fila('Escritura y referencias', e.e)}</table>
      <p class="chico">Cada criterio se califica con 5,0, 4,0, 3,0 o 1,5.</p>`;
    if (!sis && e.sim !== undefined) {
      const alta = parseInt(e.ia, 10) >= 30;
      ensayo += `<p>Turnitin: <span class="chip">Similitud ${esc(e.sim)}</span> <span class="chip ${alta ? 'alerta' : ''}">IA ${esc(e.ia)}</span></p>`;
    }
    ensayo += `<p>${esc(e.obs)}</p>`;
  }
  let taller = '';
  if (d.taller_obs) taller = `<section><h2>Taller en clase</h2><p>${esc(d.taller_obs)}</p></section>`;
  else if (!d.taller) taller = '<section><h2>Taller en clase</h2><p>No figuras en la lista del taller hecho en clase.</p></section>';

  $('#m').innerHTML = `<div class="resultado">
    <div>
      <p class="nombre">${esc(d.nombre)} · ${cod} · ${sis ? 'Ingeniería de Sistemas' : 'Ingeniería Agronómica'}</p>
      <div class="final">${fmt(d.corte)} <small>/ 5,0</small></div>
      <span class="estado ${ec}">${et}</span>
      <p class="explica">Nota del corte 2: promedio entre el parcial (${fmt(d.parcial, dp)}) y el promedio de las otras tres notas (${fmt(otras)}).</p>
      <table>
        <tr><td>Parcial${barra(d.parcial)}</td><td class="n">${val(d.parcial, dp)}</td></tr>
        <tr><td>${sis ? 'Talleres previos' : 'Notas previas'}<span class="d">Actividades de las semanas anteriores</span>${barra(d.previas)}</td><td class="n">${val(d.previas)}</td></tr>
        <tr><td>Ensayo<span class="d">${sis ? 'Informe' : 'Ensayo'} sobre la Lectura 1</span>${barra(e.nota)}</td><td class="n">${val(e.nota)}</td></tr>
        <tr><td>Taller en clase${barra(d.taller)}</td><td class="n">${val(d.taller)}</td></tr>
      </table>
    </div>
    <div>
      <section><h2>Parcial</h2>${parcial}</section>
      <section><h2>Ensayo</h2>${ensayo}</section>
      ${taller}
    </div>
  </div>`;
}

$('#f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const cod = $('#cod').value.replace(/\D/g, '');
  if (!cod) return;
  $('#b').disabled = true;
  $('#m').innerHTML = '<p class="aviso">Buscando…</p>';
  try {
    const d = await abrir(cod);
    if (d) render(d, cod);
    else $('#m').innerHTML = '<p class="aviso">No encontramos ese código. Revisa que esté completo (9 dígitos). Si sigue sin aparecer, escríbeme por Google Chat.</p>';
  } catch (err) {
    $('#m').innerHTML = '<p class="aviso">No se pudo cargar la información. Intenta de nuevo en unos minutos.</p>';
  } finally {
    $('#b').disabled = false;
  }
});
</script>
</body>
</html>
